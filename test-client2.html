<!DOCTYPE html>
<html>

<head>
    <title>Bhabhi Thulla Matchmaking</title>

    <style>
        body {
            font-family: Arial;
            background: #111;
            color: white;
            text-align: center;
            padding-top: 40px;
        }

        .player {
            background: #222;
            margin: 10px auto;
            padding: 20px;
            width: 90%;
            max-width: 700px;
            border-radius: 10px;
        }

        button {
            padding: 12px 25px;
            margin-top: 10px;
            font-size: 16px;
            cursor: pointer;
        }

        #queue {
            font-size: 28px;
            margin-top: 30px;
        }

        #status {
            margin-top: 20px;
            font-size: 20px;
        }

        /* =========================
           MY CARDS
        ========================= */

        #cardsContainer {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 12px;
            margin-top: 25px;
        }

        .card {
            width: 80px;
            height: 110px;
            background: white;
            color: black;
            border-radius: 8px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            font-size: 25px;
            font-weight: bold;

            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);

            cursor: pointer;

            transition: 0.2s;
        }

        .card:hover {
            transform: translateY(-8px);
        }

        /* =========================
           DISABLED CARD
        ========================= */

        .card.disabled {
            opacity: 0.45;
            cursor: not-allowed;
        }

        .card.disabled:hover {
            transform: none;
        }

        .rank {
            font-size: 25px;
        }

        .suit {
            font-size: 32px;
            margin-top: 5px;
        }

        .red {
            color: red;
        }

        .black {
            color: black;
        }

        #cardCount {
            margin-top: 15px;
            font-size: 18px;
            color: #aaa;
        }

        /* =========================
           TABLE
        ========================= */

        #tableCards {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;

            min-height: 130px;

            margin-top: 25px;
        }

        .table-card {
            width: 80px;
            height: 110px;

            background: white;
            color: black;

            border-radius: 8px;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            font-size: 25px;
            font-weight: bold;

            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.5);
        }

        .table-player {
            font-size: 12px;
            color: #555;
            margin-top: 5px;
        }

        /* =========================
           TURN
        ========================= */

        #turn {
            margin-top: 15px;
            font-size: 22px;
            color: #00ff88;
        }
    </style>
</head>

<body>

    <h1>🃏 Bhabhi Thulla</h1>

    <h2>Matchmaking Test</h2>

    <!-- PLAYER -->

    <div class="player">

        <h2 id="playerName">
            Not Connected
        </h2>

        <button onclick="startMatch()">
            START MATCH
        </button>

    </div>

    <!-- MATCH STATUS -->

    <div id="queue">
        Match Finding: 0 / 4
    </div>

    <div id="status">
        Connecting...
    </div>

    <!-- TURN -->

    <div id="turn">
        Turn: Waiting...
    </div>

    <!-- MY CARDS -->

    <div class="player">

        <h2>🃏 My Cards</h2>

        <div id="cardCount">
            No cards received
        </div>

        <div id="cardsContainer">
        </div>

    </div>

    <!-- TABLE CARDS -->

    <div class="player">

        <h2>🎴 Table</h2>

        <div id="tableCards">
            No card played
        </div>

    </div>

    <!-- SOCKET.IO -->

    <script src="http://localhost:3000/socket.io/socket.io.js"></script>

    <script>

        // =================================
        // SOCKET
        // =================================

        const socket = io("http://localhost:3000");


        // =================================
        // CHANGE THESE FOR EACH TAB
        // =================================

        const userId = "user_2";
        const name = "bbbbb";


        // =================================
        // GAME VARIABLES
        // =================================

        let currentRoomId = null;

        let mySeat = null;

        let myCards = [];

        let currentTurn = null;


        // =================================
        // CONNECT
        // =================================

        socket.on("connect", () => {

            console.log("Connected!");

            console.log(
                "Socket ID:",
                socket.id
            );

            document.getElementById(
                "playerName"
            ).innerText = name;

            document.getElementById(
                "status"
            ).innerText = "Online";


            // Join game

            socket.emit("join_game", {

                userId: userId,

                name: name

            });

        });


        // =================================
        // START MATCH
        // =================================

        function startMatch() {

            console.log(
                "Start match clicked"
            );

            socket.emit(
                "find_match"
            );

            document.getElementById(
                "status"
            ).innerText =
                "Finding Match...";

        }


        // =================================
        // MATCH STATUS
        // =================================

        socket.on(
            "match_status",
            (data) => {

                console.log(
                    "Match status:",
                    data
                );

                document.getElementById(
                    "queue"
                ).innerText =
                    `Match Finding: ${data.players} / ${data.requiredPlayers}`;

            }
        );


        // =================================
        // MATCH STARTED
        // =================================

        socket.on(
            "match_started",
            (data) => {

                console.log(
                    "MATCH STARTED!"
                );

                console.log(data);


                // Save room

                currentRoomId =
                    data.roomId;


                // Save my seat

                mySeat =
                    data.yourSeat;


                document.getElementById(
                    "queue"
                ).innerText =
                    "🎮 MATCH STARTED";


                document.getElementById(
                    "status"
                ).innerText =
                    "Room: " + data.roomId;


                console.log(
                    "My User ID:",
                    data.yourUserId
                );


                console.log(
                    "My Seat:",
                    mySeat
                );


                console.log(
                    "Players:",
                    data.players
                );


                // Render cards again
                // according to current turn

                displayCards(myCards);

            }
        );


        // =================================
        // YOUR CARDS
        // =================================

        socket.on(
            "your_cards",
            (data) => {

                console.log(
                    "MY CARDS:",
                    data.cards
                );


                myCards =
                    data.cards;


                displayCards(
                    myCards
                );

            }
        );


        // =================================
        // DISPLAY MY CARDS
        // =================================

        function displayCards(cards) {

            const container =
                document.getElementById(
                    "cardsContainer"
                );


            const count =
                document.getElementById(
                    "cardCount"
                );


            // Clear old cards

            container.innerHTML = "";


            // Card count

            count.innerText =
                "Cards: " +
                cards.length;


            // Create cards

            cards.forEach(
                (card) => {

                    const cardElement =
                        document.createElement(
                            "div"
                        );


                    cardElement.className =
                        "card";


                    // Rank

                    const rank =
                        document.createElement(
                            "div"
                        );

                    rank.className =
                        "rank";

                    rank.innerText =
                        getRankName(
                            card.rank
                        );


                    // Suit

                    const suit =
                        document.createElement(
                            "div"
                        );

                    suit.className =
                        "suit";

                    suit.innerText =
                        getSuitSymbol(
                            card.suit
                        );


                    // Red / Black

                    if (
                        card.suit === "hearts" ||
                        card.suit === "diamonds"
                    ) {

                        cardElement.classList.add(
                            "red"
                        );

                    } else {

                        cardElement.classList.add(
                            "black"
                        );

                    }


                    cardElement.appendChild(
                        rank
                    );

                    cardElement.appendChild(
                        suit
                    );


                    // =================================
                    // TURN CHECK
                    // =================================

                    if (
                        currentTurn === mySeat
                    ) {

                        // My turn
                        // Card is clickable

                        cardElement.onclick =
                            function () {

                                playCard(card);

                            };

                    } else {

                        // Not my turn
                        // Card disabled

                        cardElement.classList.add(
                            "disabled"
                        );

                    }


                    container.appendChild(
                        cardElement
                    );

                }
            );

        }


        // =================================
        // PLAY CARD
        // =================================

        function playCard(card) {

            console.log(
                "Card clicked:",
                card
            );


            // Room check

            if (!currentRoomId) {

                console.log(
                    "Room not available"
                );

                return;

            }


            // Extra frontend turn check

            if (
                currentTurn !== mySeat
            ) {

                console.log(
                    "Not my turn!"
                );

                return;

            }


            // Send to backend

            socket.emit(
                "play_card",
                {

                    roomId:
                        currentRoomId,

                    userId:
                        userId,

                    card:
                        card

                }
            );


            console.log(
                "play_card emitted"
            );

        }


        // =================================
        // CARD PLAYED
        // SAME ROOM ONLY
        // =================================

        socket.on(
            "card_played",
            (data) => {

                console.log(
                    "CARD PLAYED:",
                    data
                );


                showPlayedCard(
                    data
                );


                // If this is MY card
                // remove it from my hand

                if (
                    data.userId === userId
                ) {

                    myCards =
                        myCards.filter(
                            (card) =>
                                !(
                                    card.rank ===
                                        data.card.rank &&
                                    card.suit ===
                                        data.card.suit
                                )
                        );


                    displayCards(
                        myCards
                    );

                }

            }
        );


        // =================================
        // SHOW CARD ON TABLE
        // =================================

        function showPlayedCard(data) {

            const container =
                document.getElementById(
                    "tableCards"
                );


            // Create card

            const cardElement =
                document.createElement(
                    "div"
                );


            cardElement.className =
                "table-card";


            // Rank

            const rank =
                document.createElement(
                    "div"
                );

            rank.innerText =
                getRankName(
                    data.card.rank
                );


            // Suit

            const suit =
                document.createElement(
                    "div"
                );

            suit.innerText =
                getSuitSymbol(
                    data.card.suit
                );


            // Red / Black

            if (
                data.card.suit === "hearts" ||
                data.card.suit === "diamonds"
            ) {

                cardElement.style.color =
                    "red";

            }


            // Player info

            const player =
                document.createElement(
                    "div"
                );

            player.className =
                "table-player";


            player.innerText =
                "Seat " +
                data.seat;


            // Add

            cardElement.appendChild(
                rank
            );

            cardElement.appendChild(
                suit
            );

            cardElement.appendChild(
                player
            );


            container.appendChild(
                cardElement
            );

        }


        // =================================
        // TURN CHANGED
        // =================================

        socket.on(
            "turn_changed",
            (data) => {

                console.log(
                    "TURN CHANGED:",
                    data
                );


                currentTurn =
                    data.currentTurn;


                // Update turn text

                document.getElementById(
                    "turn"
                ).innerText =
                    "Turn: Seat " +
                    currentTurn;


                // If my turn

                if (
                    currentTurn === mySeat
                ) {

                    document.getElementById(
                        "turn"
                    ).innerText =
                        "🔥 YOUR TURN";

                }


                // IMPORTANT:
                // Re-render cards
                // so only current player
                // can click

                displayCards(
                    myCards
                );

            }
        );


        // =================================
        // PLAY CARD ERROR
        // =================================

        socket.on(
            "play_card_error",
            (data) => {

                console.log(
                    "PLAY CARD ERROR:",
                    data
                );


                document.getElementById(
                    "status"
                ).innerText =
                    "❌ " +
                    data.message;

            }
        );


        // =================================
        // RANK
        // =================================

        function getRankName(rank) {

            switch (rank) {

                case 1:
                    return "A";

                case 11:
                    return "J";

                case 12:
                    return "Q";

                case 13:
                    return "K";

                default:
                    return rank;

            }

        }


        // =================================
        // SUIT
        // =================================

        function getSuitSymbol(suit) {

            switch (suit) {

                case "spades":
                    return "♠";

                case "hearts":
                    return "♥";

                case "diamonds":
                    return "♦";

                case "clubs":
                    return "♣";

                default:
                    return suit;

            }

        }


        // =================================
        // DISCONNECT
        // =================================

        socket.on(
            "disconnect",
            () => {

                document.getElementById(
                    "status"
                ).innerText =
                    "Disconnected";

            }
        );

    </script>

</body>

</html>
