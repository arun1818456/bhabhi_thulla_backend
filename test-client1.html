<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Thulla Match Testing</title>

    <script src="http://localhost:5000/socket.io/socket.io.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: auto;
        }

        h1 {
            margin-bottom: 20px;
        }

        .card {
            background: #1f2937;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-top: 12px;
            margin-bottom: 5px;
            color: #d1d5db;
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #374151;
            background: #111827;
            color: white;
        }

        button {
            padding: 10px 16px;
            margin-top: 15px;
            margin-right: 8px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
        }

        .primary {
            background: #22c55e;
            color: white;
        }

        .secondary {
            background: #3b82f6;
            color: white;
        }

        .danger {
            background: #ef4444;
            color: white;
        }

        .status {
            padding: 10px;
            background: #111827;
            border-radius: 8px;
            margin-top: 15px;
        }

        pre {
            background: #030712;
            padding: 15px;
            border-radius: 8px;
            overflow-x: auto;
            max-height: 300px;
            overflow-y: auto;
        }

        .players {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
            margin-top: 15px;
        }

        .player {
            background: #374151;
            padding: 12px;
            border-radius: 8px;
        }

        .cards {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 15px;
        }

        .card-item {
            background: white;
            color: black;
            padding: 10px;
            border-radius: 6px;
            min-width: 60px;
            text-align: center;
            font-weight: bold;
        }

        .connected {
            color: #22c55e;
            font-weight: bold;
        }

        .disconnected {
            color: #ef4444;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>🃏 Thulla Socket Testing</h1>

        <!-- USER -->
        <div class="card">

            <h2>👤 Player</h2>

            <label>User ID</label>

            <input id="userId" value="user_1" placeholder="user_1" />

            <label>Name</label>

            <input id="userName" value="Arun" placeholder="Arun" />

            <label>Entry Fee</label>

            <input id="entryFee" type="number" value="100" />

            <button class="secondary" onclick="connectSocket()">
                Connect
            </button>

            <div id="connectionStatus" class="status disconnected">
                Disconnected
            </div>

        </div>


        <!-- LOBBY -->
        <div class="card">

            <h2>🏠 Lobby</h2>

            <button class="primary" onclick="createLobby()">
                Create Lobby
            </button>

            <label>Lobby ID</label>

            <input id="lobbyId" placeholder="Lobby ID" />

            <button class="secondary" onclick="joinLobby()">
                Join Lobby
            </button>

            <br>

            <button class="primary" onclick="findMatch()">
                🚀 Start / Find Match
            </button>

            <div id="lobbyStatus" class="status">
                No lobby
            </div>

            <div id="players" class="players"></div>

        </div>


        <!-- ROOM -->
        <div class="card">

            <h2>🎮 Room</h2>

            <div id="roomStatus">
                Room not created
            </div>

        </div>


        <!-- CARDS -->
        <div class="card">

            <h2>🃏 My Cards</h2>

            <div id="cards" class="cards"></div>

        </div>


        <!-- LOG -->
        <div class="card">

            <h2>📡 Socket Logs</h2>

            <pre id="logs"></pre>

        </div>

    </div>


    <script>

        let socket = null;

        let currentLobbyId = null;

        let currentRoomId = null;


        // ==================================================
        // LOG
        // ==================================================

        function log(title, data = null) {

            const logs =
                document.getElementById("logs");

            const time =
                new Date().toLocaleTimeString();

            let message =
                `[${time}] ${title}`;

            if (data !== null) {

                message +=
                    "\n" +
                    JSON.stringify(
                        data,
                        null,
                        2
                    );
            }

            logs.textContent =
                message +
                "\n\n" +
                logs.textContent;
        }


        // ==================================================
        // GET USER DATA
        // ==================================================

        function getUserData() {

            return {

                userId:
                    document.getElementById(
                        "userId"
                    ).value.trim(),

                name:
                    document.getElementById(
                        "userName"
                    ).value.trim(),

                entryFee:
                    Number(
                        document.getElementById(
                            "entryFee"
                        ).value
                    ),
            };
        }


        // ==================================================
        // CONNECT SOCKET
        // ==================================================

        function connectSocket() {

            if (socket) {

                socket.disconnect();
            }


            const user =
                getUserData();


            if (!user.userId) {

                alert(
                    "Enter User ID"
                );

                return;
            }


            /*
              IMPORTANT:
        
              Change this URL if your backend
              is running somewhere else.
            */

            socket =
                io(
                    "http://localhost:5000",
                    {
                        transports: [
                            "websocket"
                        ],

                        query: {

                            userId:
                                user.userId,

                            name:
                                user.name,
                        }
                    }
                );


            socket.on(
                "connect",
                () => {
                    socket.emit("join_game", {
                        userId: user.userId,
                        name: user.name,
                    });
                    document
                        .getElementById(
                            "connectionStatus"
                        )
                        .textContent =
                        "Connected: " +
                        socket.id;


                    document
                        .getElementById(
                            "connectionStatus"
                        )
                        .className =
                        "status connected";


                    log(
                        "✅ Socket Connected",
                        {
                            socketId:
                                socket.id,

                            userId:
                                user.userId,

                            name:
                                user.name,
                        }
                    );
                }
            );


            socket.on(
                "disconnect",
                (reason) => {

                    document
                        .getElementById(
                            "connectionStatus"
                        )
                        .textContent =
                        "Disconnected: " +
                        reason;


                    document
                        .getElementById(
                            "connectionStatus"
                        )
                        .className =
                        "status disconnected";


                    log(
                        "❌ Socket Disconnected",
                        reason
                    );
                }
            );


            // ==================================================
            // LOBBY CREATED
            // ==================================================

            socket.on(
                "lobby_created",
                (data) => {

                    currentLobbyId =
                        data.lobbyId;


                    document
                        .getElementById(
                            "lobbyId"
                        )
                        .value =
                        currentLobbyId;


                    log(
                        "🏠 Lobby Created",
                        data
                    );


                    updateLobby(
                        data
                    );
                }
            );


            // ==================================================
            // LOBBY UPDATED
            // ==================================================

            socket.on(
                "lobby_updated",
                (data) => {

                    currentLobbyId =
                        data.lobbyId;


                    document
                        .getElementById(
                            "lobbyId"
                        )
                        .value =
                        currentLobbyId;


                    log(
                        "👥 Lobby Updated",
                        data
                    );


                    updateLobby(
                        data
                    );
                }
            );


            // ==================================================
            // LOBBY STATE
            // ==================================================

            socket.on(
                "lobby_state",
                (data) => {

                    log(
                        "🏠 Lobby State",
                        data
                    );


                    updateLobby(
                        data
                    );
                }
            );


            // ==================================================
            // MATCH SEARCHING
            // ==================================================

            socket.on(
                "match_searching",
                (data) => {

                    log(
                        "🔎 Match Searching",
                        data
                    );


                    document
                        .getElementById(
                            "lobbyStatus"
                        )
                        .innerHTML =

                        `🔎 Searching...<br>
           Players:
           ${data.currentPlayers}/${data.requiredPlayers}<br>
           Need:
           ${data.needPlayers}`;
                }
            );


            // ==================================================
            // ROOM CREATED
            // ==================================================

            socket.on(
                "room_created",
                (data) => {

                    currentRoomId =
                        data.roomId;


                    log(
                        "🎮 ROOM CREATED",
                        data
                    );


                    document
                        .getElementById(
                            "roomStatus"
                        )
                        .innerHTML =

                        `<b>Room Created</b><br>
           Room ID:
           ${data.roomId}<br>
           Players:
           ${data.playersCount}<br>
           Entry:
           ${data.entryFee}`;
                }
            );


            // ==================================================
            // MATCH STARTED
            // ==================================================

            socket.on(
                "match_started",
                (data) => {

                    currentRoomId =
                        data.roomId;


                    log(
                        "🚀 MATCH STARTED",
                        data
                    );


                    document
                        .getElementById(
                            "roomStatus"
                        )
                        .innerHTML =

                        `<b>🚀 Game Started</b><br>
           Room:
           ${data.roomId}<br>
           Your Seat:
           ${data.yourSeat}<br>
           First Turn:
           ${data.currentTurn}`;

                    renderPlayers(
                        data.players
                    );
                }
            );


            // ==================================================
            // YOUR CARDS
            // ==================================================

            socket.on(
                "your_cards",
                (data) => {

                    log(
                        "🃏 YOUR CARDS",
                        data
                    );


                    renderCards(
                        data.cards
                    );
                }
            );


            // ==================================================
            // LOBBY ERROR
            // ==================================================

            socket.on(
                "lobby_error",
                (data) => {

                    log(
                        "❌ Lobby Error",
                        data
                    );

                    alert(
                        data.message ||
                        "Lobby Error"
                    );
                }
            );


            // ==================================================
            // MATCH ERROR
            // ==================================================

            socket.on(
                "match_error",
                (data) => {

                    log(
                        "❌ Match Error",
                        data
                    );

                    alert(
                        data.message ||
                        "Match Error"
                    );
                }
            );
        }


        // ==================================================
        // CREATE LOBBY
        // ==================================================

        function createLobby() {

            if (!socket) {

                alert(
                    "Connect socket first"
                );

                return;
            }


            const user =
                getUserData();


            socket.emit(
                "create_lobby",
                {

                    entryFee:
                        user.entryFee,
                }
            );


            log(
                "📤 create_lobby",
                {
                    entryFee:
                        user.entryFee
                }
            );
        }


        // ==================================================
        // JOIN LOBBY
        // ==================================================

        function joinLobby() {

            if (!socket) {

                alert(
                    "Connect socket first"
                );

                return;
            }


            const lobbyId =
                document
                    .getElementById(
                        "lobbyId"
                    )
                    .value.trim();


            if (!lobbyId) {

                alert(
                    "Enter Lobby ID"
                );

                return;
            }


            socket.emit(
                "join_lobby",
                {
                    lobbyId
                }
            );


            log(
                "📤 join_lobby",
                {
                    lobbyId
                }
            );
        }


        // ==================================================
        // FIND MATCH
        // ==================================================

        function findMatch() {

            if (!socket) {

                alert(
                    "Connect socket first"
                );

                return;
            }


            const lobbyId =
                document
                    .getElementById(
                        "lobbyId"
                    )
                    .value.trim();


            if (!lobbyId) {

                alert(
                    "Create or join lobby first"
                );

                return;
            }


            socket.emit(
                "find_match",
                {
                    lobbyId
                }
            );


            log(
                "📤 find_match",
                {
                    lobbyId
                }
            );
        }


        // ==================================================
        // UPDATE LOBBY UI
        // ==================================================

        function updateLobby(data) {

            currentLobbyId =
                data.lobbyId;


            const players =
                data.players || [];


            document
                .getElementById(
                    "lobbyStatus"
                )
                .innerHTML =

                `🏠 Lobby:
       <b>${data.lobbyId}</b><br>
       Players:
       ${players.length}/
       ${data.requiredPlayers || 4}<br>
       Entry:
       ${data.entryFee || 0}`;


            renderPlayers(
                players
            );
        }


        // ==================================================
        // RENDER PLAYERS
        // ==================================================

        function renderPlayers(
            players
        ) {

            const container =
                document.getElementById(
                    "players"
                );


            container.innerHTML = "";


            players.forEach(
                player => {

                    const div =
                        document.createElement(
                            "div"
                        );


                    div.className =
                        "player";


                    div.innerHTML =

                        `<b>Seat ${player.seat}</b>
           <br>
           ${player.name}
           <br>
           <small>
           ${player.userId}
           </small>`;


                    container.appendChild(
                        div
                    );
                }
            );
        }


        // ==================================================
        // RENDER CARDS
        // ==================================================

        function renderCards(
            cards
        ) {

            const container =
                document.getElementById(
                    "cards"
                );


            container.innerHTML = "";


            if (!cards) {

                return;
            }


            cards.forEach(
                card => {

                    const div =
                        document.createElement(
                            "div"
                        );


                    div.className =
                        "card-item";


                    const suit =
                        card.suit ||
                        card.type ||
                        "";


                    const rank =
                        card.rank ||
                        card.value ||
                        "";


                    div.innerHTML =

                        `${rank}<br>
           ${suit}`;


                    container.appendChild(
                        div
                    );
                }
            );
        }

    </script>

</body>

</html>
